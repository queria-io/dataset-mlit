version: 2

models:
  - name: raw_price_index_residential
    description: >
      不動産価格指数（住宅）の Excel を、パイプラインが縦持ちにした Parquet。
      1行 = 地域 × 季節調整の別 × 用途 × 月。

  - name: raw_price_index_commercial
    description: >
      不動産価格指数（商業用不動産）の Excel を、パイプラインが縦持ちにした Parquet。
      1行 = 地域 × 季節調整の別 × 用途 × 四半期。

  - name: raw_transaction_volume
    description: >
      不動産取引件数・面積の Excel を、パイプラインが縦持ちにした Parquet。
      1行 = 地域 × 用途 × 月。
