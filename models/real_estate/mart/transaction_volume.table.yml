schema: real_estate
name: transaction_volume
title: 不動産取引件数・面積
description: |-
  所有権移転登記をもとにした、用途別・取引主体別の不動産の取引件数と面積です。1 行が 1 地域・用途・月で、2008 年 4 月からです。

  - 主に中古の取引で、既存住宅販売量指数の販売量とは別のものです。公表後 3 か月は改訂されます
  - 地域は上位と下位が同じテーブルに並びます。合計は地域の階層をまたがないように絞ってください
keywords:
  - 不動産取引件数
  - 不動産取引面積
  - 取引件数
  - 所有権移転登記
  - 中古住宅
  - 中古マンション
  - オフィス
  - 店舗
  - 倉庫
  - 工場
  - 法人
  - 不動産
published: true
sources:
  - path: https://www.mlit.go.jp/totikensangyo/totikensangyo_tk5_000085.html
fields:
  - name: region_code
    title: 地域番号
    description: 公表資料の地域番号。1=全国、2-1〜2-9=地方ブロック、3-1〜3-3=都市圏、4-1〜4-3=都府県
  - name: region_name
    title: 地域名
  - name: prefecture_code
    title: 都道府県コード
    description: 2桁。東京都・愛知県・大阪府の行だけに入り、それ以外の地域は NULL
    semantic: { role: entity, name: prefecture }
  - name: category
    title: 用途
    description: 戸建住宅・マンション(区分所有)・店舗・オフィスなど 7 区分
  - name: period_start
    title: 対象月
    description: 対象月の1日
  - name: year
    title: 年
  - name: month
    title: 月
  - name: transaction_count
    title: 取引件数
  - name: transaction_count_change_rate
    title: 取引件数の対前年同月比（%）
    description: 公表資料の値。2008年4月〜2009年3月は比べる月が無いので NULL
  - name: count_individual_to_individual
    title: 取引件数（個人→個人）
    description: 売り手が個人、買い手が個人の取引の件数
  - name: count_individual_to_corporation
    title: 取引件数（個人→法人）
    description: 売り手が個人、買い手が法人の取引の件数
  - name: count_corporation_to_individual
    title: 取引件数（法人→個人）
    description: 売り手が法人、買い手が個人の取引の件数
  - name: count_corporation_to_corporation
    title: 取引件数（法人→法人）
    description: 売り手が法人、買い手が法人の取引の件数
  - name: count_corporate_net_purchase
    title: 法人の売買動向（件数）
    description: 法人が買った件数 − 売った件数。正なら法人の買い越し
  - name: transaction_area
    title: 取引面積（㎡）
  - name: transaction_area_change_rate
    title: 取引面積の対前年同月比（%）
    description: 公表資料の値。2008年4月〜2009年3月は比べる月が無いので NULL
  - name: area_individual_to_individual
    title: 取引面積（個人→個人、㎡）
  - name: area_individual_to_corporation
    title: 取引面積（個人→法人、㎡）
  - name: area_corporation_to_individual
    title: 取引面積（法人→個人、㎡）
  - name: area_corporation_to_corporation
    title: 取引面積（法人→法人、㎡）
  - name: area_corporate_net_purchase
    title: 法人の売買動向（面積、㎡）
    description: 法人が買った面積 − 売った面積。正なら法人の買い越し
