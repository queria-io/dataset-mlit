schema: real_estate
name: price_index_residential
title: 不動産価格指数（住宅）
description: |-
  不動産価格指数（住宅）の月次の値で、2010 年平均を 100 とします。1 行が 1 地域・季節調整の別・用途・月で、2008 年 4 月からです。

  - 全国・地方ブロック・都市圏・都府県が同じテーブルに並びます。合計や平均は地域の階層をまたがないように絞ってください
  - 変化率は季節調整値が前月比、原系列が前年同月比です（`change_basis`）
keywords:
  - 不動産価格指数
  - 住宅価格
  - マンション価格
  - 戸建住宅
  - 住宅地
  - 地価
  - 不動産
published: true
sources:
  - path: https://www.mlit.go.jp/totikensangyo/totikensangyo_tk5_000085.html
fields:
  - name: region_code
    title: 地域番号
    description: 公表資料の地域番号。1=全国、2-1〜2-9=地方ブロック、3-1〜3-3=都市圏、4-1〜4-3=都府県
  - name: region_name
    title: 地域名
  - name: prefecture_code
    title: 都道府県コード
    description: 2桁。東京都・愛知県・大阪府の行だけに入り、それ以外の地域は NULL
    semantic: { role: entity, name: prefecture }
  - name: adjustment
    title: 季節調整の別
    description: 季節調整 / 原系列
  - name: category
    title: 用途
    description: 住宅総合 / 住宅地 / 戸建住宅 / マンション(区分所有)
  - name: period_start
    title: 対象月
    description: 対象月の1日
  - name: year
    title: 年
  - name: month
    title: 月
  - name: price_index
    title: 不動産価格指数
    description: 2010年平均 = 100
  - name: change_basis
    title: 変化率の比べ方
    description: 対前月比（季節調整値）/ 対前年同月比（原系列）
  - name: change_rate
    title: 変化率（%）
    description: 公表資料の値。系列の最初の月など、比べる月が無いときは NULL
  - name: sample_count
    title: サンプル数
    description: 指数の算出に使った取引の件数
