version: 2

models:
  - name: source_file
    description: |
      地方整備局・北海道開発局の入札結果データの Excel の一覧。1行 = 1つの原本（URL と sha256 の組）。

      出典: 各地方整備局・北海道開発局「入札結果データ」（国土交通省）
    access: public
    columns:
      - name: sha256
        data_tests:
          - not_null
  - name: bid_result
    description: |
      地方整備局・北海道開発局の直轄の建設工事と建設コンサルタント業務等の入札結果。1行 = 案件 × 入札業者。

      出典: 各地方整備局・北海道開発局「入札結果データ」（国土交通省）を加工して作成。
    access: public
    columns:
      - name: bid_id
        data_tests:
          - not_null
      - name: bidder_name
        data_tests:
          - not_null
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: ["工事", "業務"]
