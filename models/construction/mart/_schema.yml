version: 2

models:
  - name: cost_deflator_monthly
    description: |
      建設工事費デフレーター（月次）。1行 = 工事種類 × 月。
      2020年度平均を100とする指数で、2016年4月から。

      出典: 「建設工事費デフレーター」（国土交通省）を加工して作成。
    access: public

  - name: cost_deflator_fiscal_year
    description: |
      建設工事費デフレーター（年度次）。1行 = 工事種類 × 年度。
      2020年度平均を100とする指数で、1951年度から。

      出典: 「建設工事費デフレーター」（国土交通省）を加工して作成。
    access: public

  - name: design_labor_unit_price
    description: |
      公共工事設計労務単価（都道府県別・職種別）。1行 = 適用開始月 × 都道府県 × 職種。
      所定労働時間内8時間当たりの円で、2012年度から。

      出典: 「公共工事設計労務単価」（国土交通省）を加工して作成。
    access: public
