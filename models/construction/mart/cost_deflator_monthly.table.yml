  - 建設工事費
  - デフレーター
  - 実質化
  - 建設投資
  - 物価指数
  - 建築
  - 土木
  - 公共事業
published: true
sources:
  - path: https://www.mlit.go.jp/statistics/details/t-other-2_tk_000362.html
fields:
  - name: category_order
    title: 工事種類の並び順
    description: 公表資料の列の順（1〜75）。1=建設総合で、括りの下に内訳が続く
  - name: category
    title: 工事種類
    description: 公表資料の見出しの名前。住宅と非住宅の両方に「鉄筋RC」があるように、名前だけでは一意にならない
  - name: category_path
    title: 工事種類の括り
    description: 上の括りから順に「 > 」でつないだもの（建設総合 > 建築総合 > 住宅総合 など）。この列で一意
  - name: parent_category
    title: 一つ上の括り
    description: 最上位の建設総合と、構造別・用途別の15系列は NULL
  - name: level
    title: 括りの深さ
    description: 1=建設総合と構造別・用途別の15系列、2=建築総合・建築補修・土木総合で、内訳ほど大きい
  - name: period_start
    title: 対象月
    description: 対象月の1日
  - name: year
    title: 年
  - name: month
    title: 月
  - name: fiscal_year
    title: 年度
    description: 4月始まりの年度。1〜3月は前の年の年度
  - name: deflator
    title: 建設工事費デフレーター
    description: 2020年度平均 = 100
