schema: construction
name: cost_deflator_monthly
title: 建設工事費デフレーター（月次）
description: >
  国土交通省が毎月公表する建設工事費デフレーター。建設工事の名目の工事費を、
  2020年度の価格で測った実質額に直すための指数で、2020年度平均を100とする。
  1行 = 工事種類 × 月で、2016年4月から収録する。毎月末に2か月前の月が足される。

  工事種類は75系列。建設総合の下に、建築（住宅・非住宅を木造・鉄筋RC・鉄骨Sなどの構造別に）、
  建築補修、土木（公共事業の治水・道路・下水道・港湾など、その他土木の鉄道軌道・電力など）が
  階層で並ぶ。上位の括りと内訳が同じ表にあるので、category_path や level で絞ってから使う。
  道路2(再掲)・街路2(再掲)は他の系列を組み直した再掲。
  ほかに、上の括りを持たない構造別・用途別の15系列（W在来住宅、RC学校、S工場・倉庫など）がある。

  名目額をこの指数で割って100を掛けると、2020年度価格の実質額になる。
  ウエイトは2022年度までは各年度の建設投資の実績、2023年度以降は2020〜2022年度の平均を暫定的に使っている。
  営業余剰や消費税などの間接税はウエイトに含まない。用地費と補償費は対象外。

  出典: 「建設工事費デフレーター」（国土交通省）
  https://www.mlit.go.jp/statistics/details/t-other-2_tk_000362.html を加工して作成。
keywords:
