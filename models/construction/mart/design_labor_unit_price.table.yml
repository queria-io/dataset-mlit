    semantic: { role: entity, name: prefecture }
  - name: prefecture_name
    title: 都道府県名
  - name: occupation_code
    title: 職種コード
    description: 公表資料の「調査対象職種の定義・作業内容」の番号（01〜51）
  - name: occupation
    title: 職種
    description: 2013年度までの「交通誘導員A・B」は、後の名称の交通誘導警備員A・Bにそろえている
  - name: unit_price
    title: 設計労務単価
    description: 円。所定労働時間内8時間当たり
  - name: is_held_over
    title: 前年度に据え置いた単価か
    description: 2021年3月・2022年3月適用分の特別措置で前年度の単価に据え置いたものは true
  - name: is_disaster_area_rate
    title: 被災3県の括弧書きの単価か
    description: 岩手県・宮城県・福島県で、公表資料が括弧書きにした単価は true。2012年4月分は同年2月の臨時改定の単価、2013年度以降は入札不調の発生状況等に応じた単価
