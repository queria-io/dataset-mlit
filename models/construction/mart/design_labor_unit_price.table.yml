schema: construction
name: design_labor_unit_price
title: 公共工事設計労務単価（都道府県別・職種別）
description: |-
  公共工事の積算に使う、都道府県別・職種別の建設技能者の日額単価（8 時間当たりの円）です。1 行が 1 適用開始月・都道府県・職種で、2012 年度の単価からです。

  - 単価が設定されていない職種・都道府県は行がありません
  - 時間外などの割増賃金と、法定福利費などの経費は含みません
