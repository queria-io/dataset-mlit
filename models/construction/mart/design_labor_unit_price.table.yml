schema: construction
name: design_labor_unit_price
title: 公共工事設計労務単価（都道府県別・職種別）
description: >
  農林水産省と国土交通省が公共工事の予定価格の積算に使うために定める、建設技能者の職種別の日額単価。
  毎年の公共事業労務費調査で集めた賃金の支払い実態をもとに、都道府県ごと・職種ごとに決める。
  1行 = 適用開始月 × 都道府県 × 職種で、2012年度の単価から改定ごとに収録する。

  単価は所定労働時間内8時間当たりの円で、基本給相当額・基準内手当・臨時の給与（賞与等）・実物給与を含む。
  時間外・休日・深夜の割増賃金と、法定福利費（事業主負担分）などの現場管理費・一般管理費は含まない。

  職種は51職種で、調査で十分な標本が得られなかった職種・都道府県は単価が設定されず、行が無い。
  全国で設定されていない職種もあり、屋根ふき工は2020年3月適用分から、建築ブロック工は2014年2月適用分まで、
  タイル工は2017年3月・2018年3月適用分に単価が無い。

  2021年3月・2022年3月適用分は、新型コロナウイルス感染症の影響下の特別措置として、前年度を下回った単価を
  前年度に据え置いており、据え置いた単価は is_held_over が true。
  2022年3月適用分までの岩手県・宮城県・福島県には、ほかと別に定めた単価（公表資料の括弧書き）があり、
  is_disaster_area_rate が true。2012年4月分は同年2月20日の臨時改定から適用している単価、
  2013年度以降は入札不調の発生状況等に応じた単価。

  2014年4月は同年2月の単価を引き続き適用すると告知されただけなので、行が無い。
  岩手県・宮城県・福島県だけを対象にした2012年2月・6月の臨時の改定は、それぞれの適用開始月の行としては収録していない。
  2月の改定の単価は2012年4月分の括弧書きとして入っている。

  出典: 「公共工事設計労務単価」（国土交通省）
  https://www.mlit.go.jp/totikensangyo/const/1_6_bt_000217.html を加工して作成。
