schema: construction
name: source_file
title: 建設のテーブルの元にしたファイル
description: |-
  construction のテーブルの元にした国土交通省の Excel・PDF の一覧です。1 行が 1 つのファイルで、同じ URL でも中身が変われば別の行になります。各テーブルの source_sha256 と sha256 で結合できます。
primary_key: [sha256]
fields:
  - name: url
    title: 取得した URL
  - name: page_url
    title: 掲載されていたページの URL
  - name: sha256
    title: ファイルの sha256
  - name: bytes
    title: バイト数
  - name: media_type
    title: メディアタイプ
  - name: retrieved_at
    title: 取得した日時（UTC）
  - name: etag
    title: 取得したときの ETag ヘッダー
  - name: last_modified
    title: 取得したときの Last-Modified ヘッダー
