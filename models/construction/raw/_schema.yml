version: 2

models:
  - name: raw_cost_deflator_monthly
    description: >
      建設工事費デフレーター（月次）の Excel を、パイプラインが縦持ちにした Parquet。
      1行 = 工事種類 × 月。

  - name: raw_cost_deflator_fiscal_year
    description: >
      建設工事費デフレーター（年度次）の Excel を、パイプラインが縦持ちにした Parquet。
      1行 = 工事種類 × 年度。

  - name: raw_design_labor_unit_price
    description: >
      公共工事設計労務単価の記者発表 PDF の単価表を、パイプラインが縦持ちにした Parquet。
      1行 = 適用開始月 × 都道府県 × 職種。
