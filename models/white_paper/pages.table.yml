schema: white_paper
name: pages
title: 国土交通白書のページ
description: |-
  国土交通白書の本文をページごとに取り出したテーブルです。1 行が 1 つの PDF の 1 ページです。

  - text は PDF の文字を取り出して NFKC で正規化した値です。段組みの順序や図の中の文字の位置は PDF の描画順のままで、読む順になっていないことがあります
  - 見出しなどで文字コードの対応表が無いフォントの文字は、Adobe-Japan1 の文字の番号（CID）から文字に戻しています。戻した文字の数が cid_repaired_chars です。図の目盛りなど一部の文字は戻せずに残っています
  - page は PDF の 1 始まりのページ番号です。印刷されたページ番号は page_label にあります（PDF に付いているときだけ）
  - page_url で PDF の該当ページを開けます
primary_key: [sha256, page]
sources:
  - path: https://www.mlit.go.jp/statistics/file000004.html
fields:
  - name: sha256
    title: PDF の sha256
    description: white_paper.documents の sha256
  - name: edition
    title: 年版
  - name: page
    title: ページ
    description: PDF の 1 始まりのページ番号
  - name: page_label
    title: ページラベル
    description: PDF に付いている印刷上のページ番号
  - name: text
    title: 本文
  - name: cid_repaired_chars
    title: CID から戻した文字数
  - name: page_url
    title: ページの URL
    description: PDF の URL に #page=ページ番号 を付けたもの
