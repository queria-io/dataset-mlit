version: 2

models:
  - name: traffic_census_section
    description: |
      令和3年度 全国道路・街路交通情勢調査（道路交通センサス）一般交通量調査の
      交通調査基本区間ごとの結果。1行 = 1区間で、昼間12時間・24時間の自動車類交通量、
      大型車混入率、混雑度、旅行速度、道路構造、代表沿道状況と区間形状を持つ。

      交通量は全区間が実測ではない。観測・非観測の別が「非観測（推定値）」の区間は
      平成27年度調査から推定した値。

      出典: 「令和3年度全国道路・街路交通情勢調査 一般交通量調査」（国土交通省）を
      加工して作成。
    access: public

  - name: traffic_census_hourly
    description: |
      時間帯別交通量。1行 = 調査単位区間 × 上下 × 車種 × 時間帯。
      区間の単位が traffic_census_section より粗いため、基本区間をまたいで
      合計すると二重に数えることになる。

      出典: 「令和3年度全国道路・街路交通情勢調査 一般交通量調査」（国土交通省）を
      加工して作成。
    access: public
