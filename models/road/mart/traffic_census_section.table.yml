  - name: speed_offpeak_down
    title: 昼間（非混雑時）旅行速度 下り
  - name: speed_12h_up
    title: 昼間12時間平均旅行速度 上り
    description: 時間帯別交通量で加重平均したもの
  - name: speed_12h_down
    title: 昼間12時間平均旅行速度 下り
  - name: road_width_m
    title: 道路部幅員
    description: m
  - name: carriageway_width_m
    title: 車道幅員
    description: m
  - name: lanes
    title: 車線数
  - name: sidewalk_ratio
    title: 歩道設置率
    description: '%'
  - name: bus_route_ratio
    title: バス路線延長率
    description: '%'
  - name: signalized_intersection_density
    title: 信号交差点密度
    description: 箇所/km
  - name: unsignalized_intersection_density
