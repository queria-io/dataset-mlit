schema: road
name: traffic_census_section
title: 道路交通センサス 区間別交通量
description: >
  令和3年度 全国道路・街路交通情勢調査（道路交通センサス）一般交通量調査の
  交通調査基本区間ごとの結果。1行 = 1区間で、昼間12時間・24時間の自動車類交通量、
  大型車混入率、混雑度、旅行速度、車線数や幅員などの道路構造、代表沿道状況を持つ。
  区間の形状（MultiLineString）を付けてあるので、そのまま地図に重ねられる。

  対象は高速自動車国道・都市高速道路・一般国道・主要地方道・一般都道府県道・
  指定市の一般市道の7区分で、一般市町村道は調査対象外。

  交通量は全区間が実測ではない。up_observation_type / down_observation_type が
  「非観測（推定値）」の区間は、平成27年度調査の交通量と両年度で観測した区間の
  データから推定した値で、全国の約3割を占める。「データなし（推定不能）」の区間は
  交通量が NULL になる。

  混雑度は交通量を交通容量で割った値で、1.0 を超えると需要が容量を上回っている
  ことを表す。昼夜率は24時間交通量÷昼間12時間交通量。

  区間形状は一般交通量調査結果の可視化ツールが配信するタイルを区間番号でまとめたもの。
  配信時に座標が小数5桁（約1m）に丸められているため、原典の精度そのものではない。
  形状が得られなかった区間は geometry が NULL になる。

  出典: 「令和3年度全国道路・街路交通情勢調査 一般交通量調査」（国土交通省）
  https://www.mlit.go.jp/road/census/r3/ を加工して作成。
published: true
sources:
  - path: https://www.mlit.go.jp/road/census/r3/
