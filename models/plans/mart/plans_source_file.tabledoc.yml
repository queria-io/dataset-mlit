$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: 計画・通知等の PDF の元のファイル
description: |-
  plans.documents・plans.pages を作った PDF の一覧です。1 行が取得した URL とファイルの 1 組で、取得日時、応答の ETag・Last-Modified と、ファイルの sha256 を持ちます。

  - plans.pages の sha256 と plans.documents の sha256 がこのテーブルの sha256 を指します
  - url は取得した URL（plans.documents の fetched_url）です。PDF は行政事業レビューのシートから参照されるだけなので、page_url は NULL です
  - ファイル本体は保存していません。url から取得できます
  - ETag などを記録する前に取得したファイルは、media_type・etag・last_modified が NULL です
primary_key: [url, sha256]
sources: [rssystem]
columns:
  - name: url
    title: ファイルの URL
  - name: page_url
    title: 掲載ページの URL
  - name: sha256
    title: ファイルの sha256
  - name: bytes
    title: バイト数
  - name: media_type
    title: メディアタイプ
  - name: retrieved_at
    title: 取得した日時
    description: UTC
  - name: etag
    title: ETag
    description: 取得したときの応答の ETag ヘッダー。無ければ NULL
  - name: last_modified
    title: Last-Modified
    description: 取得したときの応答の Last-Modified ヘッダー。無ければ NULL
