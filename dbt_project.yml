name: "mlit"
version: "1.0.0"

profile: "mlit"

model-paths: ["models"]
macro-paths: ["shared/macros"]
clean-targets: ["target", "dbt_packages"]

# 白書の全文検索の索引は、府省の文書をまとめた gov_documents データセットで作る。
# 前のバージョンから引き継いだテーブルを消す
on-run-start:
  - "DROP TABLE IF EXISTS mlit.white_paper.page_bigrams"

models:
  mlit:
    +database: mlit
    +materialized: view
    road:
      raw:
        +materialized: table
      stg:
        +materialized: table
      mart:
        +materialized: table
    real_estate:
      raw:
        +materialized: table
      mart:
        +materialized: table
    construction:
      raw:
        +materialized: table
      mart:
        +materialized: table
    disposition:
      raw:
        +materialized: table
      mart:
        +materialized: table
    bid:
      raw:
        +materialized: table
      mart:
        +materialized: table
    white_paper:
      +materialized: table
    plans:
      +materialized: table
