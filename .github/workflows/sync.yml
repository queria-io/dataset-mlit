name: Sync

on:
  push:
    branches: [main]
    # 取得先は令和3年度調査に固定で、取得に1時間ほどかかる。データの中身が変わる
    # ファイルを変えたときだけ作り直す。新しい調査年度を取り込むときは手動で実行する
    paths:
      - "models/**"
      - "tests/**"
      - "pipelines/**"
      - "tools/**"
      - "main.py"
      - "dbt_project.yml"
      - "profiles.yml"
      - "packages.yml"
      - "dataset.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "shared"
      - ".github/workflows/sync.yml"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: mlit
      # 区間形状のタイル（実在する 18,004 枚）を毎回取りに行く。米国のランナーからは
      # 1リクエスト 0.6 秒ほどかかり、4 並列・全体で毎秒5リクエストまでに抑えると取得だけで約1時間かかる。
      # 既定の 90 分では余裕が無い
      timeout_minutes: 300
    secrets: inherit
