name: Sync

on:
  push:
    branches: [main]
    # 取得先は令和3年度調査に固定で、取得に1時間ほどかかる。データの中身が変わる
    # ファイルを変えたときだけ作り直す。新しい調査年度を取り込むときは手動で実行する
    paths:
      - "models/**"
      - "tests/**"
      - "pipelines/**"
      - "tools/**"
      - "main.py"
      - "dbt_project.yml"
      - "profiles.yml"
      - "packages.yml"
      - "dataset.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "shared"
      - ".github/workflows/sync.yml"
  # 行政処分・入札結果は毎月更新される。定期実行ではこの 2 つだけを取り直す（main.py）。
  # 入札結果は今年度と前年度の分しか掲載されないので、毎月取って原本を持ち続ける
  schedule:
    - cron: "0 18 10 * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@65a70f0ea45bbaebbf9adc0cedd61500ebe242e7
    with:
      dataset_name: mlit
      # 区間形状のタイル（実在する 18,004 枚）を毎回取りに行く。米国のランナーからは
      # 1リクエスト 0.6 秒ほどかかり、4 並列・全体で毎秒5リクエストまでに抑えると取得だけで約1時間かかる。
      # 行政処分の検索サイトも 1 秒に 1 回で約 4,000 ページ取るので、さらに約1時間かかる。
      # 既定の 90 分では余裕が無い
      timeout_minutes: 300
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
