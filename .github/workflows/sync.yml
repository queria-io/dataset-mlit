name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
  schedule:
    - cron: "0 19 1 7 *" # 毎年7月1日 04:00 JST（センサスの公表は調査年の翌々年6月）
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: mlit
    secrets: inherit
