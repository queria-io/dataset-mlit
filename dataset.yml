spec_version: "0.1"
name: mlit
title: 国土交通省 道路交通センサス・不動産価格指数
description: |-
  国土交通省 道路局が公表する「全国道路・街路交通情勢調査（道路交通センサス）一般交通量調査」。
  全国の道路を交通調査基本区間に区切り、区間ごとの昼間12時間・24時間交通量、大型車混入率、
  混雑度、旅行速度、車線数や幅員などの道路構造、代表沿道状況を収録する。
  時間帯別交通量は7時台から翌6時台までの1時間ごとに、上下・車種別で持つ。
  区間の形状を付けてあるので、交通量をそのまま地図に重ねられる。
  出店や施設配置の検討、沿道の需要の見立て、渋滞の把握に使える。
  調査は5年周期で、収録は令和3年度（2021年）調査。
  あわせて、国土交通省 不動産・建設経済局が毎月公表する「不動産価格指数」を収録する。
  住宅（全国・地方ブロック・都市圏・東京都・愛知県・大阪府、月次）と
  商業用不動産（全国・三大都市圏など、四半期）の指数を、2008年4月から持つ。
  出典：「令和3年度全国道路・街路交通情勢調査 一般交通量調査」（国土交通省）、
  「不動産価格指数」（国土交通省）を加工して作成。
  提供情報の最新性、正確性、完全性等が保証されたものではありません。
