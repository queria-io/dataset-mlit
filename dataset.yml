name: mlit
title: 国土交通省 道路交通センサス・不動産価格指数・建設工事費デフレーター・公共工事設計労務単価・行政処分・入札結果・国土交通白書・計画・通知等
description: |-
  国土交通省の道路交通センサス（令和3年度）の区間別・時間帯別の交通量と、不動産価格指数、不動産取引件数・面積、建設工事費デフレーター、公共工事設計労務単価、建設業者・宅地建物取引業者などへの行政処分、地方整備局・北海道開発局の直轄工事と業務の入札結果です。交通量は道路の区間の形を持ち、そのまま地図に重ねられます。行政処分は法人番号を持ちます。入札結果は案件ごとに全入札者の入札額を持ち、元の Excel も保存しています。国土交通白書は令和3年版からの本文をページごとに持ち、2 文字ずつ区切った索引で全文検索できます。行政事業レビューのシートが関係する計画・通知等として挙げる国土交通省のサイトの PDF も、ページごとの本文を持ちます。

  出典：「令和3年度全国道路・街路交通情勢調査 一般交通量調査」「不動産価格指数」「不動産取引件数・面積」「建設工事費デフレーター」「公共工事設計労務単価」「ネガティブ情報等検索サイト」（国土交通省）、各地方整備局・北海道開発局「入札結果データ」、「国土交通白書」（国土交通省）、行政事業レビュー見える化サイトが挙げる国土交通省の計画・通知等。Queria が加工したものです。
