ai_context:
  instructions: |
    ある道路の前をどれだけ車が通るか、いつ混むか、どんな車が通るかを見るためのデータ。
    出店や施設配置の検討、沿道の需要の見立て、渋滞の把握に使う。

    road.traffic_census_section が区間ごとの結果で、1行 = 1区間。地図に重ねるなら
    この表の geometry を使う。市区町村で絞るなら city_code（5桁）。

    交通量を読むときに必ず確かめること:

    - up_observation_type / down_observation_type が「非観測（推定値）」の区間は
      実測ではない。全国の約3割を占める。区間を比べる話では必ず区別する
    - 混雑度は 1.0 を超えると需要が容量を上回っている状態。区間の絶対値より
      1.0 を境にどちら側かを見るほうが実用的
    - 同じ交通量が隣り合う複数の区間に付くことがある。交通量の調査単位が
      交通調査基本区間より粗いため。区間数を数えて「何本の道が混んでいる」とは言えない

    時間帯別を見るなら road.traffic_census_hourly。結合キーは
    (traffic_pref_city_code, traffic_survey_unit_id) = (pref_city_code, survey_unit_id)。
    ただしこの結合は1対多になるので、時間帯別の値を基本区間ごとに合計してはいけない。
    並べ替えは hour ではなく hour_order（7時台が0）を使う。

    代表沿道状況（roadside_type）は、その区間の沿道が商業地域か、市街地か、
    平地部・山地部かを国が区分したもの。交通量と組み合わせると
    「人通りのある商業地」と「通過するだけの道」を分けられる。
