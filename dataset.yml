spec_version: "0.1"
name: mlit
title: 国土交通省 道路交通センサス・不動産価格指数・建設工事費デフレーター・公共工事設計労務単価・行政処分
description: |-
  国土交通省の道路交通センサス（令和3年度）の区間別・時間帯別の交通量と、不動産価格指数、不動産取引件数・面積、建設工事費デフレーター、公共工事設計労務単価、建設業者・宅地建物取引業者などへの行政処分です。交通量は道路の区間の形を持ち、そのまま地図に重ねられます。行政処分は法人番号を持ちます。

  出典：「令和3年度全国道路・街路交通情勢調査 一般交通量調査」「不動産価格指数」「不動産取引件数・面積」「建設工事費デフレーター」「公共工事設計労務単価」「ネガティブ情報等検索サイト」（国土交通省）。Queria が加工したものです。
